name: split_my_bill
description: Split My Bill - mobile app matching the PWA UI
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  shared_preferences: ^2.3.3
  uuid: ^4.5.1
  http: ^1.2.2
  supabase_flutter: ^2.8.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  app_links: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/svgs/
